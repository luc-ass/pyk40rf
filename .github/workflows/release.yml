name: Release

# Publishing is tied to a GitHub release rather than a tag push: the release
# notes are written by hand, and nothing should reach PyPI that was not
# deliberately announced.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true

      # A tag that disagrees with the version in pyproject.toml would publish
      # something nobody can match to a release. PyPI accepts a version once,
      # so this has to fail before the upload, not after.
      - name: The tag is the version
        run: |
          tag="${{ github.event.release.tag_name }}"
          version="$(uv run python -c 'import tomllib, pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "${tag}" != "v${version}" ]; then
            echo "release ${tag} does not match pyproject version ${version}" >&2
            exit 1
          fi

      - run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI verifies this workflow's identity token, so the
    # repository holds no API token at all.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
